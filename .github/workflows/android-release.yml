name: Android Release Build

# Push a tag like v3.0.0 (must equal versionName in app/build.gradle.kts) to build, sign and publish a release.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # create the GitHub release

env:
  JAVA_VERSION: "21"
  KEYSTORE_FILE: "release.jks"

jobs:
  build:
    name: Build and Release Android APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Java JDK
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Read version and check the tag
        id: version
        run: |
          VERSION_NAME=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          VERSION_CODE=$(grep -oP 'versionCode = \K[0-9]+' app/build.gradle.kts)
          TAG="${GITHUB_REF_NAME}"
          if [ "${TAG#v}" != "$VERSION_NAME" ]; then
            echo "::error::Tag $TAG does not match versionName $VERSION_NAME in app/build.gradle.kts"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Decode keystore and write keystore.properties
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          # storeFile is resolved relative to app/ by app/build.gradle.kts
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "app/${KEYSTORE_FILE}"
          {
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "storeFile=$KEYSTORE_FILE"
          } > keystore.properties

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Build release APK
        run: ./gradlew assembleRelease

      - name: Verify the APK is signed
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          "$APKSIGNER" verify --print-certs "$APK"

      - name: Write release notes
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: |
          # First line of the changelog is "v3.0.0 - Short title"; the rest are "- bullet" lines.
          FILE="fastlane/metadata/android/en-US/changelogs/${VERSION_CODE}.txt"
          if [ -f "$FILE" ]; then
            DESCRIPTION=$(head -n 1 "$FILE" | sed -E 's/^[^ ]+ +(-|–) +//')
            BULLETS=$(tail -n +2 "$FILE" | sed -E 's/^ *- */- /')
          else
            echo "::warning::No changelog at $FILE"
            DESCRIPTION="Latest Release"
            BULLETS="- Latest improvements and bug fixes"
          fi
          cat > notes.md <<EOF
          # 🚀 Alternate ${TAG} – ${DESCRIPTION}

          ## ✨ What's New in ${TAG}

          ${BULLETS}

          ## 📦 Download

          One universal APK works on every supported device (arm64, arm32, x86).

          ## 🔧 Installation

          1. Download the APK
          2. Enable "Install from unknown sources" in your Android settings
          3. Install the APK file. Updating from 2.x installs over the old app and keeps your contacts, PIN and theme.

          ## 📋 System Requirements

          - Android 7.0 (API level 24) or higher
          - Permissions: Phone state and call log (to recognise calls), Display over other apps (for the caller popup), Biometrics (optional app lock)
          - No network access: the app never goes online
          EOF

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk "alternate-${TAG}.apk"
          gh release create "$TAG" \
            "alternate-${TAG}.apk" \
            app/build/outputs/apk/release/output-metadata.json \
            --title "Release ${TAG}" \
            --notes-file notes.md
